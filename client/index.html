<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scarper</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header id="top-bar">Scarper</header>
  <div id="app">
    <aside id="sidebar">

      <!-- ── Home ── -->
      <div id="view-home" class="view">
        <div class="sidebar-section">
          <button id="create-btn">Create Game</button>
        </div>
        <div class="sidebar-section">
          <div class="sidebar-label">Join a game</div>
          <input id="join-input" type="text" placeholder="GAME CODE" maxlength="10" autocomplete="off" spellcheck="false" />
          <button id="join-btn">Join Game</button>
          <p id="join-error" class="join-error hidden">Room not found</p>
        </div>
      </div>

      <!-- ── Lobby ── -->
      <div id="view-lobby" class="view hidden">
        <div class="sidebar-section">
          <div class="sidebar-label">Room</div>
          <div class="sidebar-room-code" id="room-code-display"></div>
          <div class="sidebar-share-row">
            <span id="share-url"></span>
            <button id="copy-btn">Copy</button>
          </div>
        </div>
        <div class="sidebar-section">
          <div class="sidebar-label">Players</div>
          <div id="player-list"></div>
          <button id="add-cpu-btn" class="btn-secondary hidden">+ Add CPU</button>

        </div>
        <div id="settings-panel" class="sidebar-section hidden">
          <div class="sidebar-label">Settings</div>
          <div class="setting-row">
            <label>Portals <span id="portal-density-value">25</span>%</label>
            <input type="range" id="portal-density-slider" min="0" max="100" step="5" value="25">
          </div>
          <div class="setting-row">
            <label>Random exit</label>
            <input type="checkbox" id="random-portals-toggle">
          </div>
          <div class="setting-row">
            <label>Grid <span id="size-value">21</span>&times;<span id="size-value2">21</span></label>
            <input type="range" id="size-slider" min="11" max="31" step="2" value="21">
          </div>
          <div class="setting-row">
            <label>Walls <span id="density-value">5</span></label>
            <input type="range" id="density-slider" min="0" max="10" step="1" value="5">
          </div>
        </div>
        <p id="settings-display" class="hidden sidebar-section settings-display"></p>
        <div class="sidebar-bottom">
          <p id="my-colour-label"></p>
          <div id="host-controls" class="hidden">
            <button id="start-btn">Start Game</button>
          </div>
          <p id="waiting-msg" class="hidden">Waiting for host…</p>
        </div>
      </div>

      <!-- ── Game ── -->
      <div id="view-game" class="view hidden">
        <div id="role-banner"></div>
        <div id="sidebar-players"></div>
        <div id="sidebar-end" class="hidden">
          <button id="end-btn" class="btn-danger">End Game</button>
        </div>
      </div>

      <!-- ── Name prompt (overlay within lobby view) ── -->
      <div id="name-screen" class="hidden">
        <div class="sidebar-section">
          <div class="sidebar-label">Your name</div>
          <input id="name-input" type="text" placeholder="your name" maxlength="20" autocomplete="off" />
          <button id="name-join-btn">Join</button>
        </div>
      </div>

    </aside>

    <main id="main-area">
      <!-- Home: decorative maze -->
      <canvas id="home-canvas" class="main-canvas"></canvas>
      <!-- Lobby: preview maze -->
      <canvas id="preview-canvas" class="main-canvas hidden"></canvas>
      <!-- Game: game canvas -->
      <canvas id="game" class="main-canvas hidden"></canvas>
      <!-- Round / game-over overlay -->
      <div id="round-overlay" class="hidden">
        <div id="round-overlay-content">
          <div id="round-overlay-title"></div>
          <div id="round-overlay-body"></div>
        </div>
      </div>
      <!-- Countdown overlay -->
      <div id="countdown-overlay" class="hidden">
        <div id="countdown-target-line"></div>
        <div id="countdown-number"></div>
        <div id="countdown-go" class="hidden">GO!</div>
      </div>
    </main>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/maze.js"></script>
  <script src="/app.js"></script>
</body>
</html>
