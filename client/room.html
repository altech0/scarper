<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scarper</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="lobby-body">
  <header id="top-bar">Scarper</header>
  <div id="lobby-content">
  <aside id="lobby-sidebar">
    <div id="name-screen">
      <input id="name-input" type="text" placeholder="your name" maxlength="20" autocomplete="off" />
      <button id="join-btn">Join</button>
    </div>

    <div id="lobby-screen" class="hidden">
      <div class="sidebar-section">
        <div class="sidebar-label">Room</div>
        <div class="sidebar-room-code" id="room-code-display"></div>
        <div class="sidebar-share-row">
          <span id="share-url"></span>
          <button id="copy-btn">Copy</button>
        </div>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-label">Players</div>
        <div id="player-list"></div>
      </div>

      <div id="settings-panel" class="hidden sidebar-section">
        <div class="sidebar-label">Settings</div>
        <div class="setting-row">
          <label>Portals <span id="portal-density-value">25</span>%</label>
          <input type="range" id="portal-density-slider" min="0" max="100" step="5" value="25">
        </div>
        <div class="setting-row">
          <label>Random exit</label>
          <input type="checkbox" id="random-portals-toggle">
        </div>
        <div class="setting-row">
          <label>Grid <span id="size-value">21</span>&times;<span id="size-value2">21</span></label>
          <input type="range" id="size-slider" min="11" max="31" step="2" value="21">
        </div>
        <div class="setting-row">
          <label>Wall density <span id="density-value">5</span></label>
          <input type="range" id="density-slider" min="0" max="10" step="1" value="5">
        </div>
      </div>

      <p id="settings-display" class="hidden settings-display"></p>

      <div class="sidebar-bottom">
        <p id="my-colour-label"></p>
        <div id="host-controls" class="hidden">
          <button id="start-btn">Start Game</button>
        </div>
        <p id="waiting-msg" class="hidden">Waiting for host...</p>
      </div>
    </div>
  </aside>

  <main id="lobby-main">
    <canvas id="preview-canvas"></canvas>
  </main>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="maze.js"></script>
  <script src="lobby.js"></script>
</body>
</html>
